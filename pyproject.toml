[project]
name = "multimodal-financial-rag"
version = "0.1.0"
description = "Multi-modal RAG over financial reports: Unstructured/pdfplumber parsing, Claude vision chart descriptions, Qdrant hybrid (dense+sparse) retrieval, optional ColPali visual embeddings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "llama-index-core>=0.12",
    "llama-index-vector-stores-qdrant>=0.4",
    "llama-index-embeddings-fastembed>=0.3",
    "qdrant-client>=1.12",
    "fastembed>=0.4",
    "unstructured[pdf]>=0.16",
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "pydantic>=2.7",
    "click>=8.1",
    "rich>=13.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
colpali = ["colpali-engine>=0.3.8", "torch>=2.2", "pillow>=10.0"]

[project.scripts]
finrag = "finrag.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27", "matplotlib>=3.8", "reportlab>=4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finrag"]

[tool.uv]
# Recent llvmlite (pulled via unstructured -> numba) no longer ships
# Intel-macOS wheels and fails to build from source; numba 0.60 / llvmlite 0.43
# is the last pair with macosx x86_64 wheels (needs Python <=3.12).
constraint-dependencies = ["llvmlite<0.44", "numba<0.61"]

[tool.pytest.ini_options]
testpaths = ["tests"]
